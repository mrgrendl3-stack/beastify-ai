<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beastify.ai - Viral Thumbnail Architect</title>
    <meta name="description" content="AI-Powered YouTube Thumbnail Generator & Analyzer using Gemini models." />
    
    <!-- Polyfill process -->
    <script>
      window.process = window.process || { env: { NODE_ENV: 'production' } };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background: radial-gradient(circle at 50% -20%, #1a1a1a, #000);
        color: #fff; 
        margin: 0; 
        padding: 0; 
        overflow-x: hidden; 
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
        opacity: 0.05;
        pointer-events: none;
        z-index: -1;
      }
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.03) 0%, transparent 70%);
        pointer-events: none;
        z-index: -1;
      }
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Montserrat:wght@900&display=swap');
      
      .thumbnail-title {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        color: #fff;
        -webkit-text-stroke: 1.5px #000;
        text-shadow: 3px 3px 0px #000;
        line-height: 1;
        text-align: center;
        pointer-events: none;
        letter-spacing: -0.02em;
      }

      .thumbnail-title-yellow {
        color: #fbbf24;
        -webkit-text-stroke: 1.5px #000;
        text-shadow: 3px 3px 0px #000;
      }

      .glass-card {
        background: rgba(15, 15, 15, 0.4);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      }

      .glass-pill {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .glass-pill:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      .glass-pill-active {
        background: rgba(6, 182, 212, 0.15) !important;
        border-color: rgba(34, 211, 238, 0.4) !important;
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
      }

      /* Liquid Glass Effect */
      .liquid-glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      .liquid-glass:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
        box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.05);
      }

      .liquid-glass:active {
        transform: scale(0.96) translateY(0);
      }

      .liquid-glass-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.02);
      }

      .liquid-glass-icon:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.3);
        transform: scale(1.08);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.05);
      }

      .liquid-glass-icon:active {
        transform: scale(0.92);
      }

      .liquid-gradient-text {
        background: linear-gradient(135deg, #fff 0%, #71717a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Glow Effects */
      .glow-cyan { filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.5)); }
      .glow-yellow { filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.5)); }
      .glow-purple { filter: drop-shadow(0 0 10px rgba(192, 38, 211, 0.5)); }

      /* Animations */
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      .animate-float { animation: float 3s ease-in-out infinite; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      #root:empty::after {
        content: "INITIALIZING LIQUID STUDIO...";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #06b6d4;
        font-weight: 900;
        letter-spacing: 0.2em;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
